name: zalo-web-clone

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-zalo_web_clone}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./chat-nestjs
      target: development
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENVIRONMENT: DEVELOPMENT
      ENVIRONMENT_MESSAGE: docker compose
      PORT: ${API_PORT:-8001}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3100}
      MYSQL_DB_HOST: mysql
      MYSQL_DB_PORT: 3306
      MYSQL_DB_USERNAME: root
      MYSQL_DB_PASSWORD: ${MYSQL_DB_PASSWORD:-secret}
      MYSQL_DB_NAME: ${MYSQL_DB_NAME:-zalo_web_clone}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # tsc's default watcher misses events on a bind-mounted volume
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    volumes:
      - ./chat-nestjs:/app
      - api-node-modules:/app/node_modules
    healthcheck:
      # node instead of curl — the base image has no curl, and node 20 ships fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous: the dev target installs and compiles before it ever listens.
      start_period: 90s

  web:
    build:
      context: ./chat-react
      target: development
    depends_on:
      api:
        condition: service_healthy
    environment:
      WEB_PORT: ${WEB_PORT:-3100}
      CHOKIDAR_USEPOLLING: "true"
      # Resolved by the browser, not inside the compose network
      VITE_API_URL: http://localhost:${API_PORT:-8001}/api
      VITE_WEBSOCKET_URL: http://localhost:${API_PORT:-8001}
    ports:
      - "${WEB_PORT:-3100}:${WEB_PORT:-3100}"
    volumes:
      - ./chat-react:/app
      - web-node-modules:/app/node_modules

volumes:
  mysql-data:
  api-node-modules:
  web-node-modules:
