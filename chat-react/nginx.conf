server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router owns the routing table; every unknown path is a client route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
